<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Heart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            background-color: #060208;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div class="hint">Double tap to toggle fullscreen</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const BG = "#060208";
        const SIZES = [9, 10, 11, 12];
        const GAP = 7;
        const DURATION = 10000; // 10s animation fill duration
        const ANIM_DURATION = 672; // ms per item lift
        const LIFT = 34;

        const PHRASES = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        let scale = 21;
        let oy = 20;
        let placedItems = [];
        let startTime = null;
        let animationComplete = false;
        let lastTouchTime = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Adjust scale factor according to viewport dimensions
            const minDim = Math.min(canvas.width, canvas.height);
            scale = minDim / 38;
            
            initHeart();
        }

        // Fullscreen toggle logic for mobile double-tap and desktop double-click
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        window.addEventListener('dblclick', toggleFullscreen);
        window.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTouchTime;
            if (tapLength < 300 && tapLength > 0) {
                toggleFullscreen();
                e.preventDefault();
            }
            lastTouchTime = currentTime;
        });

        // Parametric Heart Outline
        function heartPoint(a) {
            const x = 16 * Math.pow(Math.sin(a), 3);
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return { x: x * scale, y: y * scale + oy };
        }

        // Calculate spans and build layout matching turtle logic
        function initHeart() {
            placedItems = [];
            startTime = performance.now();
            animationComplete = false;

            const poly = [];
            const steps = 720;
            for (let i = 0; i < steps; i++) {
                poly.push(heartPoint((2 * Math.PI * i) / steps));
            }

            let yMax = -Infinity, yMin = Infinity;
            poly.forEach(p => {
                if (p.y > yMax) yMax = p.y;
                if (p.y < yMin) yMin = p.y;
            });

            const cy = (yMax + yMin) / 2;
            const edges = [];
            for (let i = 0; i < poly.length; i++) {
                edges.push([poly[i], poly[(i + 1) % poly.length]]);
            }

            function spans(y) {
                const xs = [];
                edges.forEach((edge) => {
                    const p1 = edge[0];
                    const p2 = edge[1];
                    const x1 = p1.x, y1 = p1.y;
                    const x2 = p2.x, y2 = p2.y;
                    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                        xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                    }
                });
                xs.sort((a, b) => a - b);
                const result = [];
                for (let i = 0; i < xs.length; i += 2) {
                    if (xs[i + 1] !== undefined) result.push([xs[i], xs[i + 1]]);
                }
                return result;
            }

            function intersect(A, B) {
                const out = [];
                A.forEach(a => {
                    B.forEach(b => {
                        const lo = Math.max(a[0], b[0]);
                        const hi = Math.min(a[1], b[1]);
                        if (hi - lo > 14) out.push([lo, hi]);
                    });
                });
                return out;
            }

            // Pseudo-random seeded sequence generator
            let seed = 11;
            function random() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            let phraseIndex = 0;
            let currentPhrases = [...PHRASES];
            shuffle(currentPhrases);

            function nextPhrase() {
                if (phraseIndex >= currentPhrases.length) {
                    phraseIndex = 0;
                    shuffle(currentPhrases);
                }
                return currentPhrases[phraseIndex++];
            }

            const rowH = 16;
            const half = rowH / 2;
            let y = yMax - half;

            while (y > yMin + half) {
                const row = intersect(spans(y + half), spans(y - half));

                row.forEach(([lo, hi]) => {
                    lo += 4;
                    hi -= 4;
                    let cur = lo + random() * 8;
                    const line = [];

                    while (true) {
                        let fit = null;
                        for (let k = 0; k < 10; k++) {
                            const text = nextPhrase();
                            const size = SIZES[Math.floor(random() * SIZES.length)];
                            ctx.font = `bold ${size}px Arial`;
                            const w = ctx.measureText(text).width;
                            if (cur + w <= hi) {
                                fit = { text, size, w };
                                break;
                            }
                        }
                        if (!fit) break;
                        line.append ? line.append(fit) : line.push({ x: cur + fit.w / 2, ...fit });
                        cur += fit.w + GAP;
                    }

                    if (line.length > 0) {
                        if (line.length > 1) {
                            const left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
                            line.forEach((it, i) => {
                                it.x += left * i / (line.length - 1);
                            });
                        } else {
                            line[0].x = (lo + hi) / 2;
                        }

                        line.forEach((item, i) => {
                            const edge = (i === 0 || i === line.length - 1);
                            placedItems.push({
                                x: item.x,
                                y: y,
                                text: item.text,
                                size: item.size,
                                edge: edge,
                                dx: (random() - 0.5) * 20
                            });
                        });
                    }
                });

                y -= rowH;
            }

            // Color mix routines
            const wine = [0.58, 0.0, 0.09];
            const crimson = [0.90, 0.05, 0.14];
            const blood = [0.98, 0.10, 0.16];

            function mix(a, b, k) {
                return a.map((p, i) => p + (b[i] - p) * k);
            }

            function mathDist(x, py) {
                return Math.hypot(x / (16 * scale), (py - cy) / (14.5 * scale));
            }

            placedItems.forEach(p => {
                const rad = Math.min(1.0, mathDist(p.x, p.y));
                let base = mix(wine, crimson, 0.25 + 0.75 * rad);
                base = mix(base, blood, random() * 0.35 + (p.edge ? 0.3 : 0));
                p.color = base.map(v => Math.min(1, v));
                p.rad = rad;
            });

            // Order execution (edges outer to inner shimmer order)
            const edgesList = placedItems.filter(p => p.edge);
            const innerList = placedItems.filter(p => !p.edge);

            edgesList.sort((a, b) => (Math.atan2(a.x, a.y - cy) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - cy) % (2 * Math.PI)));
            innerList.sort((a, b) => -a.rad + random() * 0.08 - (-b.rad + random() * 0.08));

            placedItems = [...edgesList, ...innerList];

            // Assign spawn times
            const total = placedItems.length;
            placedItems.forEach((p, idx) => {
                p.spawnTime = (idx / total) * DURATION;
            });
        }

        function rgb(c) {
            return `rgb(${Math.floor(c[0] * 255)}, ${Math.floor(c[1] * 255)}, ${Math.floor(c[2] * 255)})`;
        }

        function render(now) {
            const elapsed = now - startTime;

            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            let activeCount = 0;

            placedItems.forEach(p => {
                if (elapsed < p.spawnTime) return;

                activeCount++;
                const itemAge = elapsed - p.spawnTime;
                const u = Math.min(1.0, itemAge / ANIM_DURATION);
                const e = 1 - Math.pow(1 - u, 3); // Ease out cubic

                const x = centerX + p.x;
                const y = centerY - p.y;

                const hover = (1 - e) * LIFT;
                const px = x + p.dx * (1 - e);
                const py = y - hover;

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // Draw halo/shadow
                ctx.font = `bold ${p.size + 1}px Arial`;
                ctx.fillStyle = rgb(p.color.map(v => v * 0.2 * e));
                ctx.fillText(p.text, px, py);

                // Draw main text
                ctx.font = `bold ${p.size}px Arial`;
                
                let col = p.color;
                if (u < 1.0) {
                    const flash = 0.75 * Math.sin(Math.PI * Math.max(0, (u - 0.55) / 0.45));
                    col = col.map(v => Math.min(1, v + flash * 0.6));
                } else if (animationComplete) {
                    // Shimmer pulse effect after initial animation
                    const shimmerVal = Math.sin((now / 300) + p.x * 0.05) * 0.15;
                    col = col.map(v => Math.min(1, Math.max(0, v + shimmerVal)));
                }

                ctx.fillStyle = rgb(col);
                ctx.fillText(p.text, px, py);
            });

            if (elapsed > DURATION + ANIM_DURATION) {
                animationComplete = true;
            }

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame((time) => {
            startTime = time;
            render(time);
        });
    </script>
</body>
</html>
